<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WiseTrack · Strategic Initiatives</title>
    <meta name="description" content="Track strategic pillars, initiatives, projects, decisions and issues." />
    <!-- PWA. use-credentials matters: App Service Easy Auth redirects any request without the
         session cookie, and browsers fetch manifests without cookies unless told otherwise. -->
    <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="WiseTrack" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Apply the saved or system theme before first paint, so dark mode never flashes light. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('savant-tracker:theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name=theme-color]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#232930' : '#ffffff')
      })()
    </script>
    <!-- Web fonts are optional: if the network blocks them the system fallbacks in styles.css apply. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      crossorigin="anonymous"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
