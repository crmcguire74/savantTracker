<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module workbench · WiseTrack</title>
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <!-- Development only: run with `npm run dev:module`. Not part of the production build. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('savant-tracker:theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/platform/dev/main.tsx"></script>
  </body>
</html>
